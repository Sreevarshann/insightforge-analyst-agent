name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Sandbox diagnostics
        run: |
          uv run python -c "from insightforge.sql.sandbox import isolation_level; print('isolation:', isolation_level())"
          command -v bwrap || echo "bwrap not installed"
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Tests (no live LLM; fixture provider)
        run: uv run pytest -m "not live" -q
      - name: Dependency audit
        run: uvx pip-audit --strict -r <(uv export --frozen --no-dev --no-hashes --no-emit-project)
        shell: bash

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
